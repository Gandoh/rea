# One-click Render.com Blueprint (AlphaShield + REA Cloud Studio + Kelviq MoR Billing)
services:
  - type: web
    name: gandoh-alphashield
    runtime: docker
    dockerfilePath: ./studio/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: rea-studio-sqlite-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "3080"
      - key: REA_STUDIO_DATA_DIR
        value: "/data"
      - key: REA_STUDIO_RUNTIME_DIR
        value: "/tmp/rea-studio-runtime"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REA_BOOTSTRAP_API_KEY
        generateValue: true
      - key: KELVIQ_ENV
        value: "production"
      - key: KELVIQ_PRO_PLAN_ID
        value: "alphashield-pro"
      - key: KELVIQ_WHALE_PLAN_ID
        value: "alphashield-whale"
      - key: KELVIQ_ENTERPRISE_PLAN_ID
        value: "rea-ai-lab"
      - key: KELVIQ_SERVER_API_KEY
        sync: false
      - key: KELVIQ_CLIENT_API_KEY
        sync: false
      - key: KELVIQ_WEBHOOK_SECRET
        sync: false
